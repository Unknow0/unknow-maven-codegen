name: validate

on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [11, 17]

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{matrix.version}}
    - name: build
      run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.organization=unknow -Dsonar.projectKey=Unknow0_unknow-maven-codegen 
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}