name: sonar

on: 
  pull_request:
  push:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 11
    - name: build
      run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.6.0.6792:sonar -Dsonar.organization=unknow -Dsonar.projectKey=Unknow0_unknow-maven-codegen 
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}